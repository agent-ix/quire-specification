[package]
name = "quire-specification-qualification"
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license = "AGPL-3.0-or-later"
publish = false
description = "Authored definition documents by reference, plus private qualification tests"

# The library has no dependencies, so a git-dependency consumer builds only the
# authored bytes it exposes; everything below is dev-only qualification.
[lib]
name = "quire_specification"
path = "src/lib.rs"

[dev-dependencies]
quire-verification-contracts = { git = "https://github.com/agent-ix/quire-verification-contracts", branch = "main" }
jsonschema = { version = "=0.55.0", default-features = false }
serde_json = "=1.0.151"
num-bigint = "=0.4.8"
num-integer = "=0.1.47"
ix-trace-rs = { git = "https://github.com/agent-ix/ix-trace-rs", branch = "main" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
