[package]
name = "quire-specification-qualification"
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license = "AGPL-3.0-or-later"
publish = false
description = "Private qualification tests for authored shared-reference fixtures"

[dev-dependencies]
quire-verification = { git = "https://github.com/agent-ix/quire-verification", rev = "5305b40d0bc78bf2a566bd5609669373361e87b8" }
quire-verification-contracts = { git = "https://github.com/agent-ix/quire-verification-contracts", rev = "61f4a44d76d51cc53b2dfe7ed10aba7b23cfa6ef" }
jsonschema = { version = "=0.55.0", default-features = false }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
num-bigint = "=0.4.8"
num-integer = "=0.1.47"
ix-trace-rs = { git = "https://github.com/agent-ix/ix-trace-rs", rev = "2ce4ebf47f726b9d76388220545cd0abda8a5cfb" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
